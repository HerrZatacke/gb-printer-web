name: Deploy gb-items-db

on:
  push:
    branches: [ master ]
    paths:
      - 'packages/gb-items-db/**'
      - 'packages/gb-items-source/**'
      - 'packages/gb-printer-schemas/**'
      - 'Dockerfile'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gb-items-db

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout 💳
        uses: actions/checkout@v4

      - name: Add release version to environment variables 🌍
        run: |
          node -e "console.log('RELEASE_VERSION=' + require('./packages/gb-items-db/package.json').version)" >> $GITHUB_ENV

      - name: Check if tag already exists 🏷
        id: checkTag
        uses: mukunku/tag-exists-action@v1.6.0
        with:
          tag: gb-items-db-${{ env.RELEASE_VERSION }}

      - name: Log in to GHCR 🔑
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx 🏗
        uses: docker/setup-buildx-action@v3

      - name: Build and push 🚀
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create tag 🏷
        if: steps.checkTag.outputs.exists == 'false'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/gb-items-db-${process.env.RELEASE_VERSION}`,
              sha: context.sha,
            })
