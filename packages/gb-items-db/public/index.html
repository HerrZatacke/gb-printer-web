<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gb-items-db</title>
  <link rel="stylesheet" href="/gb-items-db/styles.css" />
</head>
<body>
<div class="box">
  <select id="endpoint">
    <optgroup label="Images">
      <option value="/images">getImages</option>
      <option value="/images/tags">getAllTags</option>
      <option value="/images/byHashes">getImagesByHashes</option>
      <option value="/images/hashesByGroupId">getHashesByGroupId</option>
      <option value="/images/groupItemsByGroupId">getGroupItemsByGroupId</option>
      <option value="/images/update">updateImages</option>
      <option value="/images/delete">deleteImagesByHashes</option>
    </optgroup>
    <optgroup label="ImageGroups">
      <option value="/imageGroups/list">getImageGroupsList</option>
      <option value="/imageGroups/tree">getImageGroupsFullTree</option>
      <option value="/imageGroups/update">updateImageGroups</option>
      <option value="/imageGroups/delete">deleteImageGroupsByIds</option>
    </optgroup>
  </select>
  <br>
  <textarea id="body" rows="12" cols="60">
{
  "params": {
    "sort": {
      "field": "created",
      "direction": "desc"
    },
    "page": 0,
    "pageSize": 1
  }
}
</textarea>
  <br>
  <button id="send">POST</button>
  <pre id="result"></pre>

  <script>
    document.getElementById('send').addEventListener('click', async () => {
      const raw = document.getElementById('body').value;
      const endpoint = document.getElementById('endpoint').value;
      document.getElementById('result').textContent = 'loading';
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: raw,
      });
      try {
        const data = await response.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById('result').textContent = err.message;
      }
    });
  </script>
  <a href="/auth/logout">Log out</a>
</div>
</body>
</html>
