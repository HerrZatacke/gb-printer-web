<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gb-items-db</title>
  <link rel="stylesheet" href="/gb-items-db/styles.css" />
</head>
<body>
<div class="box">
  <h1>Login</h1>
  <a id="to-discord" href="/auth/discord">Authenticate with Discord</a>
  <script>
    const url = new URL(window.location);
    const origin = url.searchParams.get('origin');
    if (origin) {
      const toDiscord = document.getElementById('to-discord');
      toDiscord.href = `${toDiscord.href}?origin=${encodeURIComponent(origin)}`
    }
  </script>
</div>
</body>
</html>
